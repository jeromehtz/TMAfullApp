<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demande de Congé</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen p-6">
    <div class="max-w-2xl w-full bg-white rounded-lg shadow-md">
        <!-- En-tête amélioré -->
        <div class="p-4 bg-blue-600 text-white rounded-t-lg flex justify-between items-center">
            <h1 class="text-2xl font-bold">Demande de Congé</h1>
            <div class="flex items-center space-x-4">
                <span id="usernameDisplay" class="font-medium"></span>
                <button onclick="logout()" class="bg-white text-blue-600 px-4 py-1 rounded hover:bg-blue-100 transition-colors">
                    Déconnexion
                </button>
            </div>
        </div>

        <!-- Formulaire -->
        <div class="p-6">
            <h2 class="text-2xl font-bold mb-4">Déposer une Demande</h2>
            <form id="congeForm" class="space-y-4">
                <div>
                    <label for="nom" class="block text-gray-700">Nom:</label>
                    <input type="text" id="nom" name="nom" required class="w-full px-3 py-2 border rounded-md focus:outline-none focus:ring-blue-500 focus:border-blue-500">
                </div>
                <div>
                    <label for="prenom" class="block text-gray-700">Prénom:</label>
                    <input type="text" id="prenom" name="prenom" required class="w-full px-3 py-2 border rounded-md focus:outline-none focus:ring-blue-500 focus:border-blue-500">
                </div>
                <div>
                    <label for="nomusager" class="block text-gray-700">Nom d'usage:</label>
                    <input type="text" id="nomusager" name="nomusager" class="w-full px-3 py-2 border rounded-md focus:outline-none focus:ring-blue-500 focus:border-blue-500">
                </div>
                <div>
                    <label for="dateDebut" class="block text-gray-700">Date de début:</label>
                    <input type="date" id="dateDebut" name="dateDebut" required class="w-full px-3 py-2 border rounded-md focus:outline-none focus:ring-blue-500 focus:border-blue-500">
                </div>
                <div>
                    <label for="dateFin" class="block text-gray-700">Date de fin:</label>
                    <input type="date" id="dateFin" name="dateFin" required class="w-full px-3 py-2 border rounded-md focus:outline-none focus:ring-blue-500 focus:border-blue-500">
                </div>
                <div>
                    <label for="raison" class="block text-gray-700">Raison:</label>
                    <select id="raison" name="raison" required class="w-full px-3 py-2 border rounded-md focus:outline-none focus:ring-blue-500 focus:border-blue-500">
                        <option value="Congés payés">Congés payés</option>
                        <option value="Congés sans solde">Congés sans solde</option>
                        <option value="Congés parentaux">Congés parentaux</option>
                        <option value="autre">Autre</option>
                    </select>
                </div>
                <input type="text" id="autreRaison" name="autreRaison" placeholder="Autre raison" class="w-full px-3 py-2 border rounded-md focus:outline-none focus:ring-blue-500 focus:border-blue-500 hidden">
                <button type="submit" class="w-full bg-blue-500 text-white py-2 rounded-md hover:bg-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-opacity-50 transition-colors">
                    Soumettre
                </button>
                
            </form>
            <div class="mt-4 flex justify-between">
                <a href="validation.html" class="text-blue-500 hover:underline">Aller à la validation des demandes</a>
                <a href="historique.html" class="bg-gray-200 text-gray-700 px-4 py-2 rounded-md hover:bg-gray-300 transition-colors">
                    Voir l'historique
                </a>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
